[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyteslacoil"
version = "1.0.0"
description = "Open-source Tesla coil design calculator — the modern replacement for JavaTC"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "PyTeslaCoil Contributors" },
]
keywords = [
    "tesla-coil",
    "electronics",
    "high-voltage",
    "physics",
    "calculator",
    "engineering",
    "electromagnetism",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

dependencies = [
    "nicegui>=3.0,<4",
    "pydantic>=2.0,<3",
    "numpy>=1.24",
    "scipy>=1.10",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
pyteslacoil = "pyteslacoil.ui.main:run"

[project.urls]
Homepage = "https://github.com/richie-rk/pyteslacoil"
Documentation = "https://github.com/richie-rk/pyteslacoil#readme"
Repository = "https://github.com/richie-rk/pyteslacoil"
Issues = "https://github.com/richie-rk/pyteslacoil/issues"

[tool.hatch.build.targets.wheel]
packages = ["pyteslacoil"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["pyteslacoil", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
# Pydantic's @computed_field is applied on top of @property.
disable_error_code = ["prop-decorator"]

[[tool.mypy.overrides]]
module = ["scipy.*", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["pyteslacoil/__init__.py:__version__"]
branch = "main"
